name: host tests

on:
  push:
  pull_request:

jobs:
  hosttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the shared ramp code against the stock-firmware model
        run: |
          gcc -std=gnu99 -Wall -Werror -Itools/hosttest -Icommon common/*.c aeris/ramp_event.c tools/hosttest/sim.c -o hosttest
          ./hosttest
